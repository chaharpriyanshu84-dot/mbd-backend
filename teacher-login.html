<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - MBD College Doora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body style="background-color: var(--bg-light);">

    <header>
        <div class="header-container" style="justify-content: center;">
            <div class="logo-section">
                <div class="logo-placeholder">MBD</div>
                <div class="title-section">
                    <h1>MBD COLLEGE DOORA</h1>
                    <p style="text-align: center;">Excellence in Education, Character & Career</p>
                </div>
            </div>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary-green)" stroke-width="2" style="width: 48px; height: 48px; margin: 0 auto 10px auto; display: block;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                <h2>Teacher & Staff Login</h2>
                <p>Access educational panels, roll sheets and notice boards</p>
            </div>

            <!-- Error Alert Box -->
            <div id="alert-box" style="display: none; padding: 10px 15px; border-radius: 4px; margin-bottom: 15px; font-size: 0.85rem; font-weight: 500; background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="staff-id">Staff ID Code</label>
                    <input type="text" id="staff-id" class="form-control" placeholder="e.g., T-2026-004" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-green" style="width: 100%; padding: 10px; margin-top:10px;">Login securely</button>
            </form>

            <div class="login-footer">
                <p>New Teacher? <a href="teacher-register.html">Register here</a></p>
                <p>Not a teacher? <a href="index.html">Return to main page</a></p>
            </div>
        </div>
    </div>

    <footer style="padding: 15px 20px; border-top: none; background-color: #1e293b;">
        <div class="footer-bottom" style="margin-top: 0; padding-top: 0; border-top: none;">
            <p>&copy; 2026 MBD College Doora. All Rights Reserved. | Made by Mayank Chahar</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const staffId = document.getElementById('staff-id').value.trim();
            const password = document.getElementById('password').value;

            alertBox.style.display = 'none';

            try {
                const response = await fetch('/api/login/teacher', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ staffId, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Store teacher details in localStorage
                localStorage.setItem('teacherUser', JSON.stringify(data.user));

                // Redirect to teacher portal
                window.location.href = 'teacher-portal.html';

            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>

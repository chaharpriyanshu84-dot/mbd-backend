<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - MBD College Doora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f6f8; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .register-container { background: #ffffff; width: 100%; max-width: 500px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eef0f2; }
        
        .register-header { text-align: center; margin-bottom: 25px; }
        .register-header h2 { font-size: 1.5rem; color: #005626; font-weight: 700; margin-bottom: 5px; }
        .register-header p { font-size: 0.82rem; color: #666; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #444; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; font-size: 0.85rem; border: 1px solid #ccc; border-radius: 6px; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: #005626; box-shadow: 0 0 0 3px rgba(0,86,38,0.1); }

        .btn-submit { width: 100%; background: #005626; color: white; border: none; padding: 11px; font-size: 0.9rem; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-submit:hover { background: #00421d; }

        .form-footer { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #666; }
        .form-footer a { color: #005626; text-decoration: none; font-weight: 600; }
        .form-footer a:hover { text-decoration: underline; }
        .form-footer div { margin-top: 8px; }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="register-header">
            <h2>Student Registration</h2>
            <p>Create a student account to access the dashboard</p>
        </div>

        <form action="#" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" class="form-control" placeholder="e.g., Rahul Kumar" required>
            </div>

            <div class="form-group">
                <label>Father's Name</label>
                <input type="text" class="form-control" placeholder="Enter Father's Name" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Registration / Roll Number</label>
                <input type="text" class="form-control" placeholder="e.g., MBD-2026-005" required>
            </div>

            <div class="form-group">
                <label>Class / Course</label>
                <input type="text" class="form-control" placeholder="e.g., B.Sc. 1st Year" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" class="form-control" placeholder="Enter 10-digit mobile number" required>
            </div>

            <div class="form-group">
                <label>Email Address <span style="font-weight: 400; color: #888;">(Optional)</span></label>
                <input type="email" class="form-control" placeholder="e.g., student@gmail.com">
            </div>

            <button type="submit" class="btn-submit">Register Account</button>
        </form>

        <div class="form-footer">
            <div>Already have an account? <a href="login.html">Log in here</a></div>
            <div>Not a student? <a href="index.html">Return to main page</a></div>
        </div>
    </div>

</body>
</html>

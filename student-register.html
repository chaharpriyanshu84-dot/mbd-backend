<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - MBD College Doora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body style="background-color: var(--bg-light);">

    <!-- Header bar to maintain brand feel -->
    <header>
        <div class="header-container" style="justify-content: center;">
            <div class="logo-section">
                <div class="logo-placeholder">MBD</div>
                <div class="title-section">
                    <h1>MBD COLLEGE DOORA</h1>
                    <p style="text-align: center;">Excellence in Education, Character & Career</p>
                </div>
            </div>
        </div>
    </header>

    <div class="login-wrapper" style="padding-top: 20px; padding-bottom: 40px;">
        <div class="login-card" style="max-width: 480px;">
            <div class="login-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary-green)" stroke-width="2" style="width: 48px; height: 48px; margin: 0 auto 10px auto; display: block;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5v-15A2.5 2.5 0 0 1 6.5 2M20 2v20"/></svg>
                <h2>Student Registration</h2>
                <p>Create a student account to access the dashboard</p>
            </div>

            <!-- Error/Success Alert Box -->
            <div id="alert-box" style="display: none; padding: 10px 15px; border-radius: 4px; margin-bottom: 15px; font-size: 0.85rem; font-weight: 500;"></div>

            <!-- Registration Form -->
            <form id="register-form">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" class="form-control" placeholder="e.g., Rahul Kumar" required>
                </div>
                <div class="form-group">
                    <label for="reg-no">Registration / Roll Number</label>
                    <input type="text" id="reg-no" class="form-control" placeholder="e.g., MBD-2026-005" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g., rahul@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a secure password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="course">Course / Stream</label>
                    <input type="text" id="course" class="form-control" placeholder="e.g., B.Sc. Computer Science" required>
                </div>
                
                <button type="submit" class="btn btn-green" style="width: 100%; padding: 10px; margin-top: 10px;">Register Student</button>
            </form>

            <div class="login-footer" style="margin-top: 20px;">
                <p>Already have an account? <a href="student-login.html">Log in here</a></p>
                <p style="margin-top: 8px;"><a href="index.html">Return to main page</a></p>
            </div>
        </div>
    </div>

    <!-- Details footer -->
    <footer style="padding: 15px 20px; border-top: none; background-color: #1e293b;">
        <div class="footer-bottom" style="margin-top: 0; padding-top: 0; border-top: none;">
            <p>&copy; 2026 MBD College Doora. All Rights Reserved. | </p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('register-form');
const alertBox = document.getElementById('alert-box');

form.addEventListener('submit', async function(e) {
    e.preventDefault();

    // Naye fields ke IDs ke mutabik values fetch kar rahe hain
    const name = document.getElementById('reg-name').value.trim();
    const fname = document.getElementById('reg-fname').value.trim();
    const dob = document.getElementById('reg-dob').value;
    const regno = document.getElementById('reg-roll').value.trim();
    const studentClass = document.getElementById('reg-class').value.trim();
    const mobile = document.getElementById('reg-mobile').value.trim();
    const email = document.getElementById('reg-email').value.trim();

    if(alertBox) alertBox.style.display = 'none';

    try {
        const response = await fetch('/api/register/student', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                name, 
                fname, 
                dob, 
                regno, 
                class: studentClass, 
                mobile, 
                email 
            })
        });

        const data = await response.json();

        if (response.ok) {
            alert('Student Registered Successfully!');
            form.reset();
        } else {
            alert(data.message || 'Registration failed!');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Something went wrong. Please try again.');
    }
});
    </script>
</body>
</html>

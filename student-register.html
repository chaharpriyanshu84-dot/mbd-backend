<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration - MBD College Doora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: var(--bg-light);">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Student Registration</h2>
                <p>Create a student account to access the dashboard</p>
            </div>

            <!-- Error/Alert Box -->
            <div id="alert-box" style="display: none; padding: 10px 15px; border-radius: 4px; margin-bottom: 15px; font-size: 0.85rem; font-weight: 500;"></div>

            <!-- Registration Form -->
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g., Rahul Kumar" required>
                </div>

                <div class="form-group">
                    <label for="reg-fname">Father's Name</label>
                    <input type="text" id="reg-fname" class="form-control" placeholder="Enter Father's Name" required>
                </div>

                <div class="form-group">
                    <label for="reg-dob">Date of Birth</label>
                    <input type="date" id="reg-dob" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="reg-roll">Registration / Roll Number</label>
                    <input type="text" id="reg-roll" class="form-control" placeholder="e.g., MBD-2026-005" required>
                </div>

                <div class="form-group">
                    <label for="reg-class">Class / Course</label>
                    <input type="text" id="reg-class" class="form-control" placeholder="e.g., B.Sc. 1st Year" required>
                </div>

                <div class="form-group">
                    <label for="reg-mobile">Mobile Number</label>
                    <input type="tel" id="reg-mobile" class="form-control" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address <span style="font-size: 0.8rem; color: #666;">(Optional)</span></label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g., student@gmail.com">
                </div>

                <button type="submit" class="btn btn-green" style="width: 100%; padding: 10px; margin-top: 10px;">Register Student</button>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a href="student-login.html">Log in here</a></p>
                <p>Not a student? <a href="index.html">Return to main page</a></p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const alertBox = document.getElementById('alert-box');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('reg-name').value.trim();
            const fname = document.getElementById('reg-fname').value.trim();
            const dob = document.getElementById('reg-dob').value;
            const regno = document.getElementById('reg-roll').value.trim();
            const studentClass = document.getElementById('reg-class').value.trim();
            const mobile = document.getElementById('reg-mobile').value.trim();
            const email = document.getElementById('reg-email').value.trim();

            if(alertBox) alertBox.style.display = 'none';

            try {
                const response = await fetch('/api/register/student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name, 
                        fname, 
                        dob, 
                        regno, 
                        class: studentClass, 
                        mobile, 
                        email 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Student Registered Successfully!');
                    form.reset();
                } else {
                    alert(data.message || 'Registration failed!');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Something went wrong. Please try again.');
            }
        });
    </script>
</body>
</html>

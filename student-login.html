<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - MBD College Doora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body style="background-color: var(--bg-light);">

    <!-- Header bar to maintain brand feel during login -->
    <header>
        <div class="header-container" style="justify-content: center;">
            <div class="logo-section">
                <div class="logo-placeholder">MBD</div>
                <div class="title-section">
                    <h1>MBD COLLEGE DOORA</h1>
                    <p style="text-align: center;">Excellence in Education, Character & Career</p>
                </div>
            </div>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary-green)" stroke-width="2" style="width: 48px; height: 48px; margin: 0 auto 10px auto; display: block;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5v-15A2.5 2.5 0 0 1 6.5 2M20 2v20"/></svg>
                <h2>Student Login Portal</h2>
                <p>Enter your registration details to view dashboard</p>
            </div>

            <!-- Error Alert Box -->
            <div id="alert-box" style="display: none; padding: 10px 15px; border-radius: 4px; margin-bottom: 15px; font-size: 0.85rem; font-weight: 500; background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca;"></div>

            <!-- Login form that redirects to student dashboard -->
            <form id="login-form">
                <div class="form-group">
                    <label for="reg-no">Registration / Roll Number</label>
                    <input type="text" id="reg-no" class="form-control" placeholder="e.g., MBD-2026-001" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 0.8rem;">
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal; margin-bottom:0;">
                        <input type="checkbox" checked> Remember session
                    </label>
                    <a href="#" onclick="alert('For recovery options, please contact the college IT coordinator.'); return false;">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-green" style="width: 100%; padding: 10px;">Login securely</button>
            </form>

            <div class="login-footer">
                <p>New Student? <a href="student-register.html">Register here</a></p>
                <p>Not a student? <a href="index.html">Return to main page</a></p>
            </div>
        </div>
    </div>

    <!-- Details footer -->
    <footer style="padding: 15px 20px; border-top: none; background-color: #1e293b;">
        <div class="footer-bottom" style="margin-top: 0; padding-top: 0; border-top: none;">
            <p>&copy; 2026 MBD College Doora. All Rights Reserved. | Made by Mayank Chahar</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const regNo = document.getElementById('reg-no').value.trim();
            const password = document.getElementById('password').value;

            alertBox.style.display = 'none';

            try {
                const response = await fetch('/api/login/student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ regNo, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Store student details in localStorage
                localStorage.setItem('studentUser', JSON.stringify(data.user));

                // Get redirect targets if any are passed
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');
                
                if (redirect) {
                    window.location.href = 'student-portal.html?tab=' + redirect;
                } else {
                    window.location.href = 'student-portal.html';
                }

            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
